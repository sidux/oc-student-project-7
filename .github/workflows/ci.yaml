name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: .cache/uv

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Static checks
        run: |
          uv run python -m compileall app script util notebook.py
          uv run python -m pip check

      - name: Run unit tests (if present)
        run: |
          if [ -d tests ] || [ -d app/tests ]; then
            uv run pytest
          else
            echo "No tests directory detected; skipping pytest."
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build --tag oc-student-project-7:ci .

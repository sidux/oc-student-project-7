name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: .cache/uv
  AZURE_RESOURCE_GROUP: oc-student-project-7
  AZURE_WEBAPP_NAME: oc-student-project-7-app
  AZURE_ACR_NAME: ocstudentproject7
  AZURE_ACR_LOGIN_SERVER: ocstudentproject7.azurecr.io
  AZURE_IMAGE_REPOSITORY: oc-student-project-7

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Static checks
        run: |
          uv run python -m compileall app script util notebook.py
          uv run python -m pip check

      - name: Run unit tests
        env:
          TESTING: "1"
        run: uv run pytest app/tests -v

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build --tag oc-student-project-7:ci .

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ env.AZURE_ACR_NAME }}"

      - name: Build & push image
        env:
          IMAGE: "${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.AZURE_IMAGE_REPOSITORY }}"
          TAG_SHA: "${{ github.sha }}"
        run: |
          docker build -t "${IMAGE}:${TAG_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Web App
        env:
          IMAGE: "${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.AZURE_IMAGE_REPOSITORY }}"
          TAG_SHA: "${{ github.sha }}"
        run: |
          ACR_USERNAME=$(az acr credential show -n "${{ env.AZURE_ACR_NAME }}" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show -n "${{ env.AZURE_ACR_NAME }}" --query "passwords[0].value" -o tsv)
          echo "::add-mask::${ACR_PASSWORD}"

          az webapp config container set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --container-image-name "${IMAGE}:${TAG_SHA}" \
            --container-registry-url "https://${{ env.AZURE_ACR_LOGIN_SERVER }}" \
            --container-registry-user "${ACR_USERNAME}" \
            --container-registry-password "${ACR_PASSWORD}"

          az webapp restart \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}"
